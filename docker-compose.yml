services:
  postgres:
    image: postgres:15
    container_name: chat-responses-codex-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: chat_responses_codex
      POSTGRES_USER: chat_responses_codex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env file}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_responses_codex -d chat_responses_codex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data

  gateway:
    image: chat-responses-codex:latest
    build:
      context: .
    container_name: chat-responses-codex
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    # Local coordination supports one authoritative gateway; enable Redis before adding replicas.
    environment:
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:3001}
      STATE_PATH: ${STATE_PATH:-/data/state.json}
      DATABASE_URL: ${DATABASE_URL:-postgres://chat_responses_codex@postgres/chat_responses_codex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env file}
      LOG_PATH: ${LOG_PATH:-/logs/chat-responses-codex.log}
      TZ: ${TZ:-Asia/Shanghai}
      UPSTREAM_CONCURRENCY_STATUS_REFRESH_SECONDS: ${UPSTREAM_CONCURRENCY_STATUS_REFRESH_SECONDS:-5}
      UPSTREAM_FIRST_SEMANTIC_OUTPUT_TIMEOUT_SECONDS: ${UPSTREAM_FIRST_SEMANTIC_OUTPUT_TIMEOUT_SECONDS:-3300}
      CODEX_STREAM_IDLE_TIMEOUT_MS: ${CODEX_STREAM_IDLE_TIMEOUT_MS:-3600000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your shell or .env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env file}
      APP_NAME: ${APP_NAME:-chat-responses-codex}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-chat2responses}
      USAGE_LOG_ROTATION_MAX_BYTES: ${USAGE_LOG_ROTATION_MAX_BYTES:-1048576}
      USAGE_LOG_ARCHIVE_MAX_FILES: ${USAGE_LOG_ARCHIVE_MAX_FILES:-10}
      USAGE_LOG_RETENTION_DAYS: ${USAGE_LOG_RETENTION_DAYS:-14}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-16}
      ADMIN_LOGS_PAGE_SIZE_MAX: ${ADMIN_LOGS_PAGE_SIZE_MAX:-200}
      UPSTREAM_HTTP_POOL_MAX_IDLE_PER_HOST: ${UPSTREAM_HTTP_POOL_MAX_IDLE_PER_HOST:-32}
      MODEL_PROBE_REFRESH_INTERVAL_SECONDS: ${MODEL_PROBE_REFRESH_INTERVAL_SECONDS:-15}
      # Automatic upstream model discovery is disabled by default.
      # Manual model discovery remains available when automatic discovery is disabled.
      UPSTREAM_MODEL_AUTO_DISCOVERY_ENABLED: ${UPSTREAM_MODEL_AUTO_DISCOVERY_ENABLED:-false}
      # Set to 0 to disable background model-key synchronization.
      UPSTREAM_MODEL_KEY_SYNC_INTERVAL_SECONDS: ${UPSTREAM_MODEL_KEY_SYNC_INTERVAL_SECONDS:-0}
      # Automatic capability probes send real inference requests and consume model tokens.
      AUTOMATIC_CAPABILITY_PROBES_ENABLED: ${AUTOMATIC_CAPABILITY_PROBES_ENABLED:-false}
      # Only revision zero is replaced; an operator-managed nonzero policy is preserved.
      CAPABILITY_POLICY_BOOTSTRAP_ON_ZERO: ${CAPABILITY_POLICY_BOOTSTRAP_ON_ZERO:-true}
      UPSTREAM_RATE_LIMIT_DEFAULT_RETRY_SECONDS: ${UPSTREAM_RATE_LIMIT_DEFAULT_RETRY_SECONDS:-30}
      # UPSTREAM_RATE_LIMIT_RETRY_WINDOW_SECONDS is parsed for backward compatibility only.
      UPSTREAM_RATE_LIMIT_RETRY_WINDOW_SECONDS: ${UPSTREAM_RATE_LIMIT_RETRY_WINDOW_SECONDS:-300}
      CONTEXT_RETRY_MAX_ATTEMPTS_CHAT: ${CONTEXT_RETRY_MAX_ATTEMPTS_CHAT:-2}
      CONTEXT_RETRY_MIN_OUTPUT_TOKENS_CHAT: ${CONTEXT_RETRY_MIN_OUTPUT_TOKENS_CHAT:-128}
      CONTEXT_RETRY_MAX_ATTEMPTS_RESPONSES: ${CONTEXT_RETRY_MAX_ATTEMPTS_RESPONSES:-3}
      CONTEXT_RETRY_MIN_OUTPUT_TOKENS_RESPONSES: ${CONTEXT_RETRY_MIN_OUTPUT_TOKENS_RESPONSES:-128}
      # UPSTREAM_RATE_LIMIT_RETRY_ATTEMPTS is deprecated for real upstream 429 responses.
      UPSTREAM_RATE_LIMIT_RETRY_ATTEMPTS: ${UPSTREAM_RATE_LIMIT_RETRY_ATTEMPTS:-3}
      # UPSTREAM_RATE_LIMIT_MAX_RETRY_AFTER_SECONDS is deprecated for route-health Retry-After.
      UPSTREAM_RATE_LIMIT_MAX_RETRY_AFTER_SECONDS: ${UPSTREAM_RATE_LIMIT_MAX_RETRY_AFTER_SECONDS:-10}
      # UPSTREAM_RATE_LIMIT_FORCE_RETRY_ENABLED does not force in-request waiting.
      UPSTREAM_RATE_LIMIT_FORCE_RETRY_ENABLED: ${UPSTREAM_RATE_LIMIT_FORCE_RETRY_ENABLED:-true}
      ROUTING_AFFINITY_ENABLED: ${ROUTING_AFFINITY_ENABLED:-true}
      ROUTING_AFFINITY_TTL_SECONDS: ${ROUTING_AFFINITY_TTL_SECONDS:-180}
      ROUTING_AFFINITY_ESCAPE_PRESSURE_RATIO: ${ROUTING_AFFINITY_ESCAPE_PRESSURE_RATIO:-1.5}
      UPSTREAM_USER_AGENT: ${UPSTREAM_USER_AGENT:-codex/0.144.6}
      UPSTREAM_CA_CERT_PATH: ${UPSTREAM_CA_CERT_PATH:-}
      UPSTREAM_CONNECT_TIMEOUT_SECONDS: ${UPSTREAM_CONNECT_TIMEOUT_SECONDS:-30}
      UPSTREAM_RESPONSE_HEADER_TIMEOUT_SECONDS: ${UPSTREAM_RESPONSE_HEADER_TIMEOUT_SECONDS:-600}
      UPSTREAM_STREAM_KEEPALIVE_INTERVAL_SECONDS: ${UPSTREAM_STREAM_KEEPALIVE_INTERVAL_SECONDS:-3}
      UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS: ${UPSTREAM_STREAM_IDLE_TIMEOUT_SECONDS:-1800}
      UPSTREAM_STREAM_MAX_DURATION_SECONDS: ${UPSTREAM_STREAM_MAX_DURATION_SECONDS:-86400}
      ADMIN_UPSTREAM_TIMEOUT_SECONDS: ${ADMIN_UPSTREAM_TIMEOUT_SECONDS:-30}
      UPSTREAM_SAME_ROUTE_RETRY_ENABLED: ${UPSTREAM_SAME_ROUTE_RETRY_ENABLED:-true}
      UPSTREAM_TRANSIENT_ROUTE_COOLDOWN_BASE_SECONDS: ${UPSTREAM_TRANSIENT_ROUTE_COOLDOWN_BASE_SECONDS:-10}
      UPSTREAM_TRANSIENT_ROUTE_COOLDOWN_MAX_SECONDS: ${UPSTREAM_TRANSIENT_ROUTE_COOLDOWN_MAX_SECONDS:-300}
      UPSTREAM_ROUTE_EXHAUSTION_RETRY_ENABLED: ${UPSTREAM_ROUTE_EXHAUSTION_RETRY_ENABLED:-true}
      UPSTREAM_ROUTE_EXHAUSTION_RETRY_MAX_WAIT_MS: ${UPSTREAM_ROUTE_EXHAUSTION_RETRY_MAX_WAIT_MS:-10000}
      UPSTREAM_ROUTE_EXHAUSTION_RETRY_MAX_ROUNDS: ${UPSTREAM_ROUTE_EXHAUSTION_RETRY_MAX_ROUNDS:-3}
      UPSTREAM_CONCURRENCY_RECOVERY_MAX_WAIT_MS: ${UPSTREAM_CONCURRENCY_RECOVERY_MAX_WAIT_MS:-600000}
      UPSTREAM_CONCURRENCY_RECOVERY_MAX_ROUNDS: ${UPSTREAM_CONCURRENCY_RECOVERY_MAX_ROUNDS:-320}
      UPSTREAM_CONCURRENCY_PROBE_DELAYS_MS: ${UPSTREAM_CONCURRENCY_PROBE_DELAYS_MS:-100,200,400,800,1000,2000}
      UPSTREAM_HEDGE_ENABLED: ${UPSTREAM_HEDGE_ENABLED:-true}
      UPSTREAM_HEDGE_DELAY_MS: ${UPSTREAM_HEDGE_DELAY_MS:-12000}
      UPSTREAM_HEDGE_INTERVAL_MS: ${UPSTREAM_HEDGE_INTERVAL_MS:-12000}
      UPSTREAM_HEDGE_MAX_EXTRA_ATTEMPTS: ${UPSTREAM_HEDGE_MAX_EXTRA_ATTEMPTS:-1}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./certs:/certs:ro

volumes:
  postgres-data:
  redis-data:

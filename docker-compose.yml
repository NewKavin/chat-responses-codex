services:
  postgres:
    image: postgres:15
    container_name: chat-responses-codex-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: chat_responses_codex
      POSTGRES_USER: chat_responses_codex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env file}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_responses_codex -d chat_responses_codex"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  gateway:
    image: chat-responses-codex:latest
    build:
      context: .
    container_name: chat-responses-codex
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3001"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Local coordination supports one authoritative gateway; enable Redis before adding replicas.
    environment:
      # Bootstrap connections, credentials, and infrastructure remain environment-only.
      BIND_ADDR: ${BIND_ADDR:-0.0.0.0:3001}
      STATE_PATH: ${STATE_PATH:-/data/state.json}
      DATABASE_URL: ${DATABASE_URL:-postgres://chat_responses_codex@postgres/chat_responses_codex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env file}
      LOG_PATH: ${LOG_PATH:-/logs/chat-responses-codex.log}
      RUST_LOG: ${RUST_LOG:-info}
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your shell or .env file}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in your shell or .env file}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-chat2responses}
      POSTGRES_POOL_MAX_SIZE: ${POSTGRES_POOL_MAX_SIZE:-16}
      UPSTREAM_CA_CERT_PATH: ${UPSTREAM_CA_CERT_PATH:-}
      # Only revision zero is replaced; an operator-managed nonzero policy is preserved.
      CAPABILITY_POLICY_BOOTSTRAP_ON_ZERO: ${CAPABILITY_POLICY_BOOTSTRAP_ON_ZERO:-true}
    volumes:
      - ./data:/data
      - ./logs:/logs
      - ./certs:/certs:ro

volumes:
  postgres-data:
  redis-data:

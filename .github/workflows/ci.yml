name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run type-check

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # G0.2 suite-count guard: a mid-run abort (e.g. SIGABRT stack overflow)
      # still prints "test result: ok" for every suite completed before the
      # crash, which looks like a green run. Count the suites and fail when
      # the expected count is not reached.
      - name: cargo test (full suite, abort guard)
        run: |
          set -o pipefail
          cargo test --all > /tmp/cargo-test.log 2>&1
          rc=$?
          echo "cargo_test_rc=$rc"
          SUITES=$(grep -cE '^test result:' /tmp/cargo-test.log || true)
          echo "suite_count=$SUITES"
          if [ "$rc" -ne 0 ]; then
            tail -n 60 /tmp/cargo-test.log
            exit "$rc"
          fi
          if [ "$SUITES" -lt 62 ]; then
            echo "::error::suite_count=$SUITES < 62: cargo test aborted mid-way (looks green but is a failure)"
            tail -n 60 /tmp/cargo-test.log
            exit 1
          fi
          echo "suite_count_ok=$SUITES"
